[build]
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"

# Aperçus (deploy previews, branch deploys) : mode « essai à blanc » (src/dev/essai-a-blanc.js).
# Les fonctions d'un aperçu utilisent les variables de PRODUCTION : sans ce mode, une commande passée sur
# un aperçu partirait réellement (e-mail, Supabase, relais PharmaML). Jamais en production.
[context.deploy-preview.environment]
  VITE_ESSAI_A_BLANC = "1"

[context.branch-deploy.environment]
  VITE_ESSAI_A_BLANC = "1"

# Anti-copie (lot A : elixir-commande/docs/refonte-charte.md § 19) : site réservé aux pharmacies clientes, ni indexé,
# ni archivé, ni utilisé pour entraîner une IA (doublé par la balise robots d'index.html et public/robots.txt).
# Pas de CSP ici : celle de la vitrine bloquerait les photos Supabase, YouTube et les blob: des ordonnances.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, noai, noimageai"

# Notifications (docs/notifications.md) : service worker et manifestes jamais gardés en cache — une nouvelle version est
# prise à la visite suivante. Le service worker n'a aucun cache ni gestionnaire « fetch » : les pages ne passent jamais par lui.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

# API des pharmacies : description OpenAPI de la documentation publique /api/ (docs/api/openapi.yaml, copiée au build par
# scripts/api-doc-plugin.mjs), toujours relue à la visite suivante
[[headers]]
  for = "/api/openapi.yaml"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/yaml; charset=utf-8"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Commandes groupées : rappels quotidiens (≈ 8 h, heure de Paris)
[functions."gp-reminders"]
  schedule = "0 6 * * *"

# Commandes sur justificatif labo : détection PharmaML + envois dus, toutes les 10 min
[functions."lab-justif-cron"]
  schedule = "*/10 * * * *"

# Commandes Sanofi Pro (Dupixent) : traitement automatique sur le portail grossiste, toutes les 10 min
[functions."sanofipro-cron"]
  schedule = "*/10 * * * *"

# Relais PharmaML (agent du Mac) : échéances, alertes si l'agent ne répond plus, toutes les 5 min
[functions."pml-relais-cron"]
  schedule = "*/5 * * * *"

# Assistant Elixir : purge des conversations (90 jours), brouillons expirés, alertes budget et pannes (≈ 4 h, heure de Paris)
[functions."chat-purge"]
  schedule = "15 2 * * *"

# Accueil « La Tête de gondole » : classement des produits les plus commandés (commandes servies, 15 jours), toutes
# les 3 h de 6 h 40 à 21 h 40 heure de Paris en hiver (après les synchros de stock), lecture Odoo seule (docs/accueil.md)
[functions."accueil-offres-refresh"]
  schedule = "40 5-20/3 * * *"

# Alertes « M'avertir du retour » : e-mails aux pharmacies dont un produit attendu est revenu en stock (une fois par
# demande, envois 7 h – 21 h heure de Paris). 50 min après chaque synchro rapide du stock de la GitHub Action
# (« 0 */3 * * * », qui appelle déjà restock-notify à la fin de ses étapes) : filet si l'Action échoue ou prend du retard
# (docs/alertes-retour.md)
[functions."restock-notify-cron"]
  schedule = "50 */3 * * *"

# Notifications de l'appli : ménage quotidien (≈ 5 h 35, heure de Paris) — envois de plus de 90 jours, appareils sans visite
# depuis 12 mois ou dont le compte n'est plus rattaché à la pharmacie, annonce bloquée (docs/notifications.md § 8)
[functions."push-menage"]
  schedule = "35 3 * * *"

# Notifications de l'appli : messages programmés de l'admin (heure de Paris choisie dans l'onglet 📲 Notifications), envoyés
# au plus 5 minutes après l'heure prévue ; messages restés « en file » relancés aux heures ouvertes, jamais plus de 3 h
# après l'heure prévue ; événements de l'outil entrepôt reçus le soir, la nuit ou le dimanche envoyés à 8 h
# (docs/notifications.md § 5 et § 6)
[functions."push-programmes"]
  schedule = "*/5 * * * *"

# Péremption courte, « Odoo facture la remise » (docs/peremption-odoo.md) : filet complet à h:25. Décisions ouvertes
# seulement : faits frais (stock et dates), retraits (page cachée 3 h avant la fin de la règle, stock court épuisé, lot long
# reçu), suppression dans Odoo après le délai et l'import des commandes en cours. Aucune création. Aux autres quarts
# d'heure : rien, sauf des retraits immédiats pas finis (« Tout retirer » navigateur fermé). Mode « Simulation » par défaut :
# aucune écriture Odoo sans PEREMPTION_ODOO_ECRITURE=1 (portée « Production ») ET le mode « Actif » de l'admin.
[functions."peremption-cron"]
  schedule = "10,25,40,55 * * * *"

# API des pharmacies (netlify/functions/api-cron.js) : toutes les 15 min — liste de prix des fiches ouvertes relue une fois
# par jour ; prix d'UNE liste au plus par passage, calculés par Odoo en arrière-plan (api-prix-background : nouvelle liste,
# liste changée, bouton de l'admin, ou la nuit entre 1 h et 6 h, heure de Paris, quand le calcul a plus de 20 h) ; ménage
# des compteurs de débit et du journal des appels (13 mois). Lectures Odoo seulement ; rien quand aucun accès n'est ouvert.
[functions."api-cron"]
  schedule = "*/15 * * * *"

# API des pharmacies, commandes (netlify/functions/api-commandes-cron.js) : toutes les 2 min — commandes réelles dont le délai
# d'annulation (10 min par défaut) est écoulé confiées à api-envoi-background (relais existant, envoiAuto ; jamais PharmaML
# directement) ; réservations ou envois restés en suspens (fonction coupée) terminés « à vérifier » ou supprimés. Aucune
# lecture Odoo ; rien tant qu'aucune commande réelle n'existe (interrupteur « Commandes par API » fermé).
[functions."api-commandes-cron"]
  schedule = "*/2 * * * *"
