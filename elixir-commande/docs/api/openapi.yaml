  /v1/commandes/{id}:
    get:
      operationId: lireCommande
      tags: [Commandes]
      summary: Détail et état d'une commande
      description: |
        État de la commande et de chaque ligne : quantité demandée, acceptée, puis, une fois prise en charge, `suivi`
        (commandée, acceptée, servie, non servie, reste à livrer, facturée), numéros de nos commandes, factures et bons de
