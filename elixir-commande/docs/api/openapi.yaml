                    id: "1790000000001"
                    environnement: live
                    canal: api
                    reference_client: REASSORT-2026-11-16-A
                    etat: sortie_entrepot
                    motif: null
                    cree_le: "2026-11-16T09:30:12+01:00"
                    annulable_jusqu_a: null
                    total_indicatif_ht: 53.8
