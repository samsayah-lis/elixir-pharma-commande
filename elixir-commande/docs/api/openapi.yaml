                    anomalies: [{ type: anomalie_quantite, cip: "3400000000011", detail: "40 boîte(s) : plus de 10 fois votre quantité mensuelle habituelle de ce produit." }]
                    avertissements: ["Commande gardée « à vérifier » par Elixir Pharma (quantité très supérieure à vos habitudes pour ce produit) : elle ne part qu'après sa validation, et reste annulable d'ici là."]
                    mention: "Prix HT de votre liste, hors offres du site. Prix indicatifs : la facture applique vos conditions au jour de la livraison."
