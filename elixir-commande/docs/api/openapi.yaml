  /v1/commandes/simulation:
    post:
      operationId: simulerCommande
      tags: [Commandes]
      summary: Simuler une commande (rien n'est enregistré)
      description: |
        Mêmes contrôles que `POST /v1/commandes`, sans rien enregistrer et sans `Idempotency-Key` : prix, contingents,
        disponibilité, plafonds, anomalies. Un refus est rendu en `200` avec `resultat: refusee` et `refus` (statut et code
        que la commande aurait reçus), y compris la fermeture des commandes réelles pour une clé de production.
      x-droit: commande
      x-classe-debit: simulation
      parameters:
        - $ref: "#/components/parameters/XElixirSimulation"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandeDemande" }
            examples:
              une_ligne:
                value: { lignes: [{ cip: "3400000000011", quantite: 12 }] }
      responses:
        "200":
          description: Ce que la commande donnerait.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Simulation" }
              examples:
                acceptee:
                  value:
                    simulation: true
                    resultat: acceptee
                    refus: null
                    environnement: test
                    etat: recue
                    motif: null
                    delai_annulation_min: 10
                    si_rupture: retirer
                    total_indicatif_ht: 44.4
                    lignes:
                      - { ligne: 1, cip: "3400000000011", nom: PRODUIT EXEMPLE A 30 CPR, quantite_demandee: 12, quantite: 12, prix_unitaire_ht: 3.7,
                          total_ht: 44.4, etat: acceptee, motif: null, detail: null }
                    anomalies: []
                    avertissements: ["Mode test : commande contrôlée comme en production, mais jamais envoyée ni facturée."]
                    mention: "Prix HT de votre liste, hors offres du site. Prix indicatifs : la facture applique vos conditions au jour de la livraison."
                fermee:
                  summary: Clé de production avant l'ouverture des commandes réelles
                  value:
                    simulation: true
                    resultat: refusee
                    refus: { statut: 503, code: ecriture_suspendue, titre: Commandes momentanément fermées,
                             detail: "Les commandes réelles par l'API ne sont pas encore ouvertes (ou momentanément fermées) : rien n'a été enregistré. Les clés de test (elx_test_) fonctionnent ; le site et votre logiciel d'officine restent disponibles." }
                    environnement: live
                    etat: null
                    motif: null
                    delai_annulation_min: null
                    si_rupture: retirer
                    total_indicatif_ht: 44.4
                    lignes:
                      - { ligne: 1, cip: "3400000000011", nom: PRODUIT EXEMPLE A 30 CPR, quantite_demandee: 12, quantite: 12, prix_unitaire_ht: 3.7,
                          total_ht: 44.4, etat: acceptee, motif: null, detail: null }
                    anomalies: []
                    avertissements: []
                    mention: "Prix HT de votre liste, hors offres du site. Prix indicatifs : la facture applique vos conditions au jour de la livraison."
        "400": { $ref: "#/components/responses/E400Simulation" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "413": { $ref: "#/components/responses/E413" }
        "422": { $ref: "#/components/responses/E422" }
        "429": { $ref: "#/components/responses/E429" }
