# API Elixir Pharma pour les pharmacies — description OpenAPI 3.1 (servie telle quelle à /api/openapi.yaml)
# Source unique : ce fichier. scripts/test-api-openapi.mjs le confronte au code (routes, droits, limites, codes d'erreur,
# contraintes de la commande) et aux réponses RÉELLES du routeur pendant les tests ; la page /api/ (public/api/index.html)
# en reprend les règles. Dépôt public : exemples FICTIFS uniquement (CIP 3400000000011, « PHARMACIE EXEMPLE »,
# commande 1790000000001), jamais de clé complète, jamais de plomberie interne.
openapi: "3.1.0"
info:
  title: API Elixir Pharma pour les pharmacies
  version: "1.0.0"
  summary: Catalogue à vos prix, disponibilités, contingents, commandes, factures et bons de livraison.
  description: |
    Réservée aux pharmacies clientes d'Elixir Pharma dont l'accès a été ouvert à leur demande, et qui ont accepté les
    conditions d'utilisation de l'API. Service gratuit. Guide complet, en français : https://elixir-commande.expepharma.com/api/

    **Authentification.** Clé dans l'en-tête `Authorization: Bearer elx_live_…` (production) ou `elx_test_…` (test),
    jamais dans l'adresse. La clé se crée dans le compte de la pharmacie (« Mes commandes » → « Accès API »). L'identité
    vient toujours de la clé : aucun identifiant de pharmacie n'est lu dans la requête.

    **Formats.** JSON en UTF-8. Montants en euros hors taxes, 2 décimales. Dates ISO 8601 à l'heure de Paris, avec le
    décalage (`2026-11-16T09:30:12+01:00`) ; jours au format `AAAA-MM-JJ`. CIP : 13 chiffres (CIP13 ou code-barres).

    **Prix.** Prix HT de votre liste, hors offres du site (menus, précommandes, péremption courte, commandes groupées) :
    le prix que votre facture applique, c'est-à-dire le plus bas des tarifs de votre liste valables pour la quantité.
    Indicatifs : la facture applique vos conditions au jour de la livraison.

    **Commandes.** `Idempotency-Key` obligatoire. Une commande acceptée part seule vers notre système de préparation à la
    fin du délai d'annulation (10 minutes par défaut), sauf anomalie nette : elle est alors gardée « à vérifier » par
    Elixir Pharma (`etat: en_attente_elixir`). Les commandes réelles ouvrent à une date communiquée par Elixir Pharma ;
    d'ici là, `POST /v1/commandes` avec une clé de production répond `503 ecriture_suspendue` et tout fonctionne en test.

    **Erreurs.** RFC 9457 (`application/problem+json`) avec un `code` stable ; chaque réponse porte `X-Request-Id`, à
    donner au support. Les codes sont expliqués sur https://elixir-commande.expepharma.com/api/#erreurs.

    **Versions.** Dans `/v1`, seulement des ajouts compatibles (champ, route, valeur annoncée) : ignorez les champs que
    vous ne connaissez pas. Une rupture ouvrira `/v2`, avec six mois de préavis.
  contact:
    name: Elixir Pharma
    email: pharmacien@elixirpharma.fr
    url: https://elixir-commande.expepharma.com/api/
  x-derniere-modification: "2026-10-24"
  # Débits par clé (fenêtres fixes : minute et jour) ; avant authentification : par adresse IP (IPv6 : par /64)
  x-limites:
    ip: { par_minute: 120 }
    refus_cle: { max: 20, fenetre_s: 600 }
    lecture: { par_minute: 60, par_jour: 5000 }
    disponibilites: { par_minute: 30, par_jour: 5000 }
    documents: { par_minute: 20, par_jour: 300 }
    commande: { par_minute: 6, par_jour: 30 }
    simulation: { par_minute: 10, par_jour: 500 }
    suivi_par_pharmacie_par_minute: 30
  # Plafonds d'une pharmacie à l'ouverture de son accès (réglables par Elixir Pharma, pharmacie par pharmacie)
  x-plafonds-defaut:
    delai_annulation_min: 10
    plafond_lignes: 100
    plafond_boites: 1000
    plafond_montant_ht: 3000
    plafond_commandes_jour: 10
    anomalie_facteur: 10
    anomalie_doublon_min: 30
  # Statut HTTP de chaque code d'erreur
  x-codes-erreur:
    json_invalide: 400
    idempotency_key_absente: 400
    cle_dans_url: 400
    cle_absente: 401
    cle_invalide: 401
    cle_revoquee: 401
    cle_expiree: 401
    portee_insuffisante: 403
    ip_non_autorisee: 403
    acces_suspendu: 403
    compte_bloque: 403
    cgu_a_accepter: 403
    test_requis: 403
    commandes_bloquees: 403
    introuvable: 404
    methode_non_autorisee: 405
    requete_en_cours: 409
    reference_deja_utilisee: 409
    trop_tard: 409
    trop_long: 413
    requete_invalide: 422
    idempotency_key_reutilisee: 422
    aucune_ligne_acceptee: 422
    commande_refusee: 422
    plafond_depasse: 422
    debit: 429
    plafond_journalier: 429
    plafond_commandes_jour: 429
    api_suspendue: 503
    ecriture_suspendue: 503
    contingent_indisponible: 503
    indisponible: 503
  # Réponses possibles sur toute adresse, avant même la clé : adresse inconnue (404 introuvable), méthode non prévue
  # (405 methode_non_autorisee, en-tête Allow), corps de plus de 256 Ko (413 trop_long), clé dans l'adresse (400
  # cle_dans_url), trop de requêtes depuis un même réseau (429 debit).
  x-erreurs-globales: [introuvable, methode_non_autorisee, trop_long, cle_dans_url, debit]

servers:
  - url: https://elixir-commande.expepharma.com/api
    description: Production (clés elx_live_ et elx_test_ ; une clé de test n'écrit jamais de vraie commande)

security:
  - cle: []

tags:
  - name: Connexion
    description: Test de la clé et réglages de votre accès.
  - name: Catalogue
    description: Catalogue au prix de votre liste, disponibilités et contingents (droit « lecture »).
  - name: Commandes
    description: Suivi (droit « lecture »), simulation, commande et annulation (droit « commande »).
  - name: Documents
    description: Factures, avoirs et bons de livraison, en liste et en PDF (droit « lecture »).

paths:
  /v1/etat:
    get:
      operationId: lireEtat
      tags: [Connexion]
      summary: Tester la connexion
      description: |
        Pharmacie de la clé, environnement, droits, réglages des commandes (délai d'annulation, plafonds, contrôles
        d'anomalie), limites de débit et version de l'API. Ouverte à toute clé valide, même pendant une suspension du
        service (`etat_service: suspendu`). Première étape du parcours de test.
      x-droit: null
      x-classe-debit: lecture
      responses:
        "200":
          description: Clé valide.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Etat" }
              examples:
                test:
                  summary: Clé de test, commandes réelles pas encore ouvertes
                  value:
                    pharmacie: PHARMACIE EXEMPLE
                    environnement: test
                    cle: { prefixe: "elx_test_Ab3d…k9Qz", libelle: Tableur de réassort, expire_le: null }
                    portees: [lecture, commande]
                    etat_service: normal
                    commandes:
                      disponibles: true
                      mode: auto
                      production: fermees
                      delai_annulation_min: 10
                      plafonds: { lignes_par_commande: 100, boites_par_commande: 1000, montant_ht_par_commande: 3000, commandes_par_jour: 10 }
                      verification: { active: true, facteur_habitude_mensuelle: 10, quasi_doublon_min: 30 }
                    prix: { base: liste_pharmacie, mention: "Prix HT de votre liste, hors offres du site" }
                    limites:
                      lecture: { par_minute: 60, par_jour: 5000 }
                      disponibilites: { par_minute: 30, par_jour: 5000 }
                      documents: { par_minute: 20, par_jour: 300 }
                      commande: { par_minute: 6, par_jour: 30 }
                      simulation: { par_minute: 10, par_jour: 500 }
                    cgu: { version_en_vigueur: "2026-10-24-projet", acceptee: true }
                    version_api: "1.0.0"
                    derniere_modification: "2026-10-24"
        "400": { $ref: "#/components/responses/E400Cle" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403Etat" }
        "429": { $ref: "#/components/responses/E429" }
        "503": { $ref: "#/components/responses/E503Etat" }

  /v1/catalogue:
    get:
      operationId: listerCatalogue
      tags: [Catalogue]
      summary: Catalogue au prix de votre liste
      description: |
        Produits du catalogue, triés par CIP, avec le prix HT de VOTRE liste (calculé comme votre facture : le plus bas
        des tarifs applicables), ses paliers de quantité, un niveau de disponibilité et l'indication « contingenté ».
        Hors offres du site. Prix recalculés chaque nuit : une synchronisation par heure suffit. Réponse identique →
        `304` avec `If-None-Match` (l'appel compte quand même dans le débit).
      x-droit: lecture
      x-classe-debit: lecture
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ParPageCatalogue"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Une page du catalogue.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            ETag: { $ref: "#/components/headers/ETag" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageCatalogue" }
              examples:
                page:
                  summary: Fiche sur une liste avec paliers
                  value:
                    donnees:
                      - { cip: "3400000000011", nom: PRODUIT EXEMPLE A 30 CPR, prix_ht: 3.86, paliers: [{ a_partir_de: 12, prix_ht: 3.7 }], disponibilite: en_stock, contingente: false }
                      - { cip: "3400000000028", nom: PRODUIT EXEMPLE B, prix_ht: 9.4, paliers: [], disponibilite: stock_faible, contingente: true }
                    page: 1
                    par_page: 2
                    total: 3
                    suivante: /api/v1/catalogue?page=2&par_page=2
                    prix: { base: liste_pharmacie, etat: a_jour, calcule_le: "2026-11-16T03:10:00+01:00" }
                    disponibilite_maj: "2026-11-16T06:40:00+01:00"
                    mention: "Prix HT de votre liste, hors offres du site (menus, précommandes, péremption courte, commandes groupées). Prix indicatifs : la facture applique vos conditions au jour de la livraison."
                    avertissements: []
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/E400Cle" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "422": { $ref: "#/components/responses/E422" }
        "429": { $ref: "#/components/responses/E429" }
        "503": { $ref: "#/components/responses/E503" }

  /v1/catalogue/{cip}:
    get:
      operationId: lireProduit
      tags: [Catalogue]
      summary: Un produit
      description: Un produit par son CIP13 ou son code-barres, au prix de votre liste. `404 introuvable` s'il n'est pas au catalogue.
      x-droit: lecture
      x-classe-debit: lecture
      parameters:
        - $ref: "#/components/parameters/CipChemin"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Le produit.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            ETag: { $ref: "#/components/headers/ETag" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProduitDetail" }
              examples:
                produit:
                  value:
                    cip: "3400000000011"
                    nom: PRODUIT EXEMPLE A 30 CPR
                    prix_ht: 3.86
                    paliers: [{ a_partir_de: 12, prix_ht: 3.7 }]
                    disponibilite: en_stock
                    contingente: false
                    prix: { base: liste_pharmacie, etat: a_jour, calcule_le: "2026-11-16T03:10:00+01:00" }
                    disponibilite_maj: "2026-11-16T06:40:00+01:00"
                    mention: "Prix HT de votre liste, hors offres du site (menus, précommandes, péremption courte, commandes groupées). Prix indicatifs : la facture applique vos conditions au jour de la livraison."
                    avertissements: []
        "304": { $ref: "#/components/responses/NonModifie" }
        "400": { $ref: "#/components/responses/E400Cle" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "404": { $ref: "#/components/responses/E404" }
        "422": { $ref: "#/components/responses/E422" }
        "429": { $ref: "#/components/responses/E429" }
        "503": { $ref: "#/components/responses/E503" }

  /v1/disponibilites:
    get:
      operationId: lireDisponibilites
      tags: [Catalogue]
      summary: Disponibilité de produits, lue à l'instant
      description: |
        Niveau de disponibilité de 1 à 200 produits, lu au moment de l'appel : `en_stock`, `stock_faible` ou `rupture`
        (jamais de quantité). Indicatif et non engageant. Produit inconnu : `disponibilite: null`, `inconnu: true`.
      x-droit: lecture
      x-classe-debit: disponibilites
      parameters:
        - name: cips
          in: query
          required: true
          description: CIP13 ou codes-barres séparés par des virgules (200 au plus, doublons ignorés).
          schema: { type: string }
          example: "3400000000011,3400000000028"
      responses:
        "200":
          description: Niveaux de disponibilité, dans l'ordre demandé.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Disponibilites" }
              examples:
                deux:
                  value:
                    donnees:
                      - { cip: "3400000000011", disponibilite: en_stock }
                      - { cip: "3400000000028", disponibilite: stock_faible }
                      - { cip: "3400000000099", disponibilite: null, inconnu: true }
                    lu_le: "2026-11-16T09:28:00+01:00"
                    mention: "Disponibilité indicative au moment de la lecture, non engageante : elle peut changer avant la préparation de votre commande."
        "400": { $ref: "#/components/responses/E400Cle" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "422": { $ref: "#/components/responses/E422" }
        "429": { $ref: "#/components/responses/E429" }
        "503": { $ref: "#/components/responses/E503" }

  /v1/contingents:
    get:
      operationId: lireContingents
      tags: [Catalogue]
      summary: Reste à commander sur les produits contingentés
      description: |
        Pour chaque produit contingenté : quantité permise sur la période, déjà commandée (tous canaux : site, API,
        logiciel d'officine) et reste. Même calcul que le panier du site. `exempte: true` si votre pharmacie n'a pas de
        contingent.
      x-droit: lecture
      x-classe-debit: lecture
      responses:
        "200":
          description: Contingents de votre pharmacie.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contingents" }
              examples:
                un:
                  value:
                    exempte: false
                    jour: "2026-11-16"
                    donnees:
                      - { cip: "3400000000028", nom: PRODUIT EXEMPLE B, quota: 6, periode: semaine, jours_glissants: null, libelle: 6 par semaine,
                          debut: "2026-11-16", fin: "2026-11-22", deja_commande: 5, reste: 1 }
        "400": { $ref: "#/components/responses/E400Cle" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "429": { $ref: "#/components/responses/E429" }
        "503": { $ref: "#/components/responses/E503" }

  /v1/commandes:
    get:
      operationId: listerCommandes
      tags: [Commandes]
      summary: Vos commandes du site et de l'API
      description: |
        Commandes passées sur le site et par l'API sur la période (92 jours au plus, 30 derniers jours par défaut), les
        plus récentes d'abord, avec leur état. Avec une clé de test, vos commandes de test (`T…`) s'y ajoutent. Les
        commandes passées depuis votre logiciel d'officine ne sont pas listées en V1.
      x-droit: lecture
      x-classe-debit: lecture
      parameters:
        - $ref: "#/components/parameters/DebutCommandes"
        - $ref: "#/components/parameters/Fin"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ParPageListe"
      responses:
        "200":
          description: Une page de commandes.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageCommandes" }
              examples:
                deux:
                  value:
                    donnees:
                      - { id: "1790000000002", environnement: live, canal: api, reference_client: REASSORT-2026-11-17-A, etat: recue, motif: null,
                          cree_le: "2026-11-17T09:30:00+01:00", annulable_jusqu_a: "2026-11-17T09:40:00+01:00", lignes: 3, commandes_elixir: [] }
                      - { id: "1790000000001", environnement: live, canal: api, reference_client: REASSORT-2026-11-16-A, etat: sortie_entrepot, motif: null,
                          cree_le: "2026-11-16T09:30:12+01:00", annulable_jusqu_a: null, lignes: 2, commandes_elixir: [S00000] }
                    page: 1
                    par_page: 20
                    suivante: null
                    periode: { debut: "2026-10-19", fin: "2026-11-17" }
        "400": { $ref: "#/components/responses/E400Cle" }
        "401": { $ref: "#/components/responses/E401" }
        "403": { $ref: "#/components/responses/E403" }
        "422": { $ref: "#/components/responses/E422" }
        "429": { $ref: "#/components/responses/E429" }
        "503": { $ref: "#/components/responses/E503" }
    post:
      operationId: passerCommande
      tags: [Commandes]
      summary: Passer une commande
      description: |
        Commande au prix de votre liste, recalculé par le serveur (aucun prix n'est lu dans la requête). Ordre des
        contrôles : accès ouvert aux commandes, conditions d'utilisation, ouverture des commandes réelles (clé de
        production), `Idempotency-Key`, structure, commandes du jour, puis chaque ligne (catalogue, produits hors API,
        prix, contingent, disponibilité), `tout_ou_rien`, plafonds, anomalies.

        - Ligne au-delà du contingent : ramenée au reste (`motif: contingentement`), refusée à 0.
        - Produit en rupture : ligne retirée (`si_rupture: retirer`, défaut) ou gardée en attente du stock (`garder`).
        - Plafond dépassé (lignes, boîtes, montant) : `422 plafond_depasse`, rien n'est enregistré.
        - Anomalie nette (quantité de plus de 10 fois votre quantité mensuelle habituelle du produit, ou commande presque
          identique à une commande reçue depuis moins de 30 minutes, tous canaux) : `201` avec
          `etat: en_attente_elixir`. La commande ne part qu'après vérification par Elixir Pharma.
        - Sinon : `201` avec `etat: recue` ; annulable jusqu'à `annulable_jusqu_a`, puis envoyée seule.

        Même `Idempotency-Key` et même corps : réponse d'origine rejouée (`Idempotent-Replayed: true`), y compris un refus.
      x-droit: commande
      x-classe-debit: commande
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XElixirSimulation"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandeDemande" }
            examples:
              reassort:
                value:
                  reference_client: REASSORT-2026-11-16-A
                  lignes: [{ cip: "3400000000011", quantite: 12 }, { cip: "3400000000028", quantite: 3 }, { cip: "3400000000035", quantite: 6 }]
                  si_rupture: retirer
      responses:
        "201":
          description: Commande enregistrée (ou réponse d'origine rejouée).
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Commande" }
              examples:
                recue:
                  summary: Une ligne ramenée au contingent, une ligne hors API
                  value:
                    id: T1790000000001
                    environnement: test
                    reference_client: REASSORT-2026-11-16-A
                    canal: api
                    etat: recue
                    motif: null
                    cree_le: "2026-11-16T09:30:12+01:00"
                    annulable_jusqu_a: "2026-11-16T09:40:12+01:00"
                    si_rupture: retirer
                    total_indicatif_ht: 53.8
                    lignes:
                      - { ligne: 1, cip: "3400000000011", nom: PRODUIT EXEMPLE A 30 CPR, quantite_demandee: 12, quantite: 12, prix_unitaire_ht: 3.7,
                          total_ht: 44.4, etat: acceptee, motif: null, detail: null }
                      - { ligne: 2, cip: "3400000000028", nom: PRODUIT EXEMPLE B, quantite_demandee: 3, quantite: 1, prix_unitaire_ht: 9.4, total_ht: 9.4,
                          etat: acceptee, motif: contingentement, detail: "Quantité ramenée au reste du contingent : 1 boîte(s) (6 par semaine, du 16/11/2026 au 22/11/2026)." }
                      - { ligne: 3, cip: "3400000000035", nom: PRODUIT EXEMPLE C, quantite_demandee: 6, quantite: 0, prix_unitaire_ht: null, total_ht: 0,
                          etat: refusee, motif: produit_sur_justificatif, detail: "À commander sur le site, page « Commande labo sur justificatif »." }
                    anomalies: []
                    avertissements: ["Mode test : commande contrôlée comme en production, mais jamais envoyée ni facturée."]
                    mention: "Prix HT de votre liste, hors offres du site. Prix indicatifs : la facture applique vos conditions au jour de la livraison."
                a_verifier:
                  summary: Gardée « à vérifier » (quantité inhabituelle)
                  value:
                    id: "1790000000003"
                    environnement: live
                    reference_client: null
                    canal: api
                    etat: en_attente_elixir
                    motif: anomalie_quantite
                    cree_le: "2026-11-18T10:05:00+01:00"
                    annulable_jusqu_a: null
                    si_rupture: retirer
                    total_indicatif_ht: 154.4
