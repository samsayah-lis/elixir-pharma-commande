name: Sync Odoo
on:
  schedule:
    - cron: "0 */3 * * *"
    - cron: "20 2 * * *"
    - cron: "50 2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Sync à lancer"
        required: true
        default: stock
        type: choice
        options: [stock, price, expiry]
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lancer la sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://commandes-elixir.netlify.app
          INPUT_TARGET: ${{ github.event.inputs.target }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          T="$INPUT_TARGET"
          if [ -z "$T" ]; then
            case "$SCHEDULE" in
              "20 2 * * *") T=price ;;
              "50 2 * * *") T=expiry ;;
              *) T=stock ;;
            esac
          fi
          echo "Sync cible : $T"
          node elixir-commande/scripts/run-sync.mjs "$T"
