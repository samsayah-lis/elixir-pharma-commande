name: Sync Odoo
on:
  schedule:
    - cron: "0 */3 * * *"   # dispo rapide toutes les 3 h (stock-quick)
    - cron: "10 1 * * *"    # chaine de nuit complete (~03:10 Paris ete / 02:10 hiver)
  workflow_dispatch:
    inputs:
      target:
        description: "Sync a lancer"
        required: true
        default: stock-quick
        type: choice
        options: [stock-quick, stock, price, expiry, pharmacies, nightly]
concurrency:
  group: sync-odoo
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lancer la sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://commandes-elixir.netlify.app
          INPUT_TARGET: ${{ github.event.inputs.target }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          run() { echo "-> Sync : $1"; node elixir-commande/scripts/run-sync.mjs "$1"; }
          T="$INPUT_TARGET"
          if [ "$T" = "nightly" ] || [ "$SCHEDULE" = "10 1 * * *" ]; then
            rc=0
            run stock      || rc=1
            run price      || rc=1
            run expiry     || rc=1
            run pharmacies || rc=1
            exit $rc
          elif [ -n "$T" ]; then
            run "$T"
          else
            run stock-quick
          fi
